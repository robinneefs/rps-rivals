<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0716" />
    <title>RPS Rivals: Rock Paper Scissors Fighter</title>
    <meta
      name="description"
      content="Pick Taiko, Riot or Anchor and outguess your rival in a pixel-art arcade fighter built on rock paper scissors. Five stages, vs the CPU or a friend online. Free in your browser."
    />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- link previews (social sites need the image's full address) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RPS Rivals" />
    <meta property="og:title" content="RPS Rivals: Rock Paper Scissors Fighter" />
    <meta
      property="og:description"
      content="Pick Taiko, Riot or Anchor and outguess your rival in a pixel-art arcade fighter built on rock paper scissors. Five stages, vs the CPU or a friend online. Free in your browser."
    />
    <meta property="og:url" content="https://robinneefs.github.io/rps-rivals/" />
    <meta property="og:image" content="https://robinneefs.github.io/rps-rivals/share-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The RPS Rivals title beside the versus screen and a K.O. from the game"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RPS Rivals: Rock Paper Scissors Fighter" />
    <meta
      name="twitter:description"
      content="Pick Taiko, Riot or Anchor and outguess your rival in a pixel-art arcade fighter built on rock paper scissors. Five stages, vs the CPU or a friend online. Free in your browser."
    />
    <meta name="twitter:image" content="https://robinneefs.github.io/rps-rivals/share-v2.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0716;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* the cabinet (cabinet/CabinetView.ts) is painted art, scaled smoothly; the game canvas in
         its screen is shrunk from a whole-number blow-up of the pixel art, smoothly too */
      #cabinet,
      #cabinet * {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }
      #cabinet img {
        -webkit-touch-callout: none;
      }
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
