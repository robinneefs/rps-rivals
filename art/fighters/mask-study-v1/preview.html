<!doctype html><meta charset="utf-8"><title>Taiko · all masked combat frames</title><style>body{background:#191a25;color:#f5efdf;font:16px system-ui;margin:24px}main{display:flex;gap:24px;flex-wrap:wrap}canvas,img{image-rendering:pixelated;background:#454859}canvas{width:480px;height:480px}button{padding:9px 14px;margin:4px}section{margin:20px 0}.review{width:min(100%,960px)}p{max-width:920px;line-height:1.5}</style><h1>Taiko · complete masked combat palette</h1><p>Approved ivory retained. Deeper, brighter crimson wraps/headband; darker charcoal belt. Every pose has its own mask. Ankles and skin remain original.</p><div id="buttons"></div><main><section><h2>Original</h2><canvas id="original" width="160" height="160"></canvas></section><section><h2>Masked alternate</h2><canvas id="alternate" width="160" height="160"></canvas></section><section><h2>Material mask overlay</h2><canvas id="overlay" width="160" height="160"></canvas></section></main><p id="label"></p><h2>Every frame · original / alternate / overlay</h2><img class="review" src="all-frames-comparison.png" alt="Every combat frame comparison"><script>const frames={"idle0":{"x":0,"y":0,"w":160,"h":160},"idle1":{"x":160,"y":0,"w":160,"h":160},"rock":{"x":320,"y":0,"w":160,"h":160},"paper":{"x":0,"y":160,"w":160,"h":160},"scissors":{"x":160,"y":160,"w":160,"h":160},"hurt":{"x":320,"y":160,"w":160,"h":160},"ko":{"x":0,"y":320,"w":160,"h":160},"win":{"x":160,"y":320,"w":160,"h":160},"kick":{"x":320,"y":320,"w":160,"h":160}},images={};let selected='idle',start=performance.now();for(const [id,url]of Object.entries({original:'../../../apps/game/public/assets/taiko.png',alternate:'taiko-masked-atlas.png',overlay:'taiko-atlas-overlay.png'})){const image=new Image();image.src=url;images[id]=image;}for(const name of ['idle',...Object.keys(frames)]){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{selected=name;start=performance.now()};document.getElementById('buttons').append(b)}function draw(now){const name=selected==='idle'?(Math.floor((now-start)/350)%2?'idle1':'idle0'):selected,f=frames[name];for(const[id,image]of Object.entries(images)){const c=document.getElementById(id).getContext('2d');c.clearRect(0,0,160,160);if(image.complete&&image.naturalWidth)c.drawImage(image,f.x,f.y,160,160,0,0,160,160)}document.getElementById('label').textContent=name;requestAnimationFrame(draw)}requestAnimationFrame(draw);</script>
